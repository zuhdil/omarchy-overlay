# omarchy-overlay tmux preferences, sourced from the end of Omarchy's
# ~/.config/tmux/tmux.conf so that every binding here wins over theirs.
# Notes (-N) make these show up in Omarchy's keybinding help (prefix ?).

# Notify when something happens in another window.
setw -g monitor-activity on
set -g visual-activity on

# --- pane focus and resize, vim style -----------------------------------------

# Replaces Omarchy's h (split) and k (kill-window), and tmux's l (last-window).
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane down"  j select-pane -D
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Replaces Omarchy's K (kill-session) and tmux's L (last session).
bind -N "Resize pane left"  -r H resize-pane -L 2
bind -N "Resize pane down"  -r J resize-pane -D 2
bind -N "Resize pane up"    -r K resize-pane -U 2
bind -N "Resize pane right" -r L resize-pane -R 2

# Swap with the neighbour, like vim's Ctrl-w H/J/K/L. -d keeps focus on the
# moved pane. At an edge, nothing: unguarded, left/right wrap around and
# up/down print an error.
bind -N "Swap pane left"  -r M-h if -F "#{pane_at_left}"   "" "swap-pane -d -t '{left-of}'"
bind -N "Swap pane down"  -r M-j if -F "#{pane_at_bottom}" "" "swap-pane -d -t '{down-of}'"
bind -N "Swap pane up"    -r M-k if -F "#{pane_at_top}"    "" "swap-pane -d -t '{up-of}'"
bind -N "Swap pane right" -r M-l if -F "#{pane_at_right}"  "" "swap-pane -d -t '{right-of}'"

# --- splits in the current directory ------------------------------------------

# The key draws the divider: \ and | side by side, - and _ stacked.
# The shifted variants split the full window rather than the pane.
bind -N "Split pane horizontally"        \\ split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically"          -  split-window -v -c "#{pane_current_path}"
bind -N "Split window full horizontally" |  split-window -hf -c "#{pane_current_path}"
bind -N "Split window full vertically"   _  split-window -vf -c "#{pane_current_path}"

# --- kill: x, then Shift, then Ctrl for a wider scope -------------------------

# Window and session ask first; they take more with them. tmux's own & still
# kills a window too.
bind -N "Kill pane"    x   kill-pane
bind -N "Kill window"  X   confirm-before -p "kill-window #W? (y/n)" kill-window
bind -N "Kill session" C-x confirm-before -p "kill-session #S? (y/n)" kill-session
