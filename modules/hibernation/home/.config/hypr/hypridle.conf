# Hibernate after a long idle period.
#
# Omarchy's own idle service (~/.config/omarchy/shell.json -> idle) only
# supports `screensaver` and `lock`; it has no hibernate timeout. hypridle
# covers that here. Both use the Wayland idle-notify protocol, so they run
# alongside each other without conflict -- keep the screensaver and lock
# timeouts in shell.json, and only the hibernate timeout below.
#
# This file is read by hypridle, not by Hyprland: `hyprctl reload` neither
# applies nor validates it. Apply changes with:
#   pkill hypridle && uwsm-app -- hypridle

general {
    # Respect apps that inhibit idle (video playback, presentations).
    ignore_dbus_inhibit = false
    # Omarchy's shell already handles locking at its own timeout.
    lock_cmd =
}

listener {
    # 30 minutes idle -> hibernate.
    timeout = 1800
    on-timeout = systemctl hibernate
}
