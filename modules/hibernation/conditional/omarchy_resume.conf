# Omarchy's `omarchy-hibernation-setup` writes exactly `HOOKS+=(resume)` here, and
# both that command and `omarchy-hibernation-remove` detect whether hibernation is
# configured by grepping for that literal line (`^HOOKS+=(resume)$`). Keep it
# verbatim so those commands keep working -- then correct the position below.
HOOKS+=(resume)

# `resume` must run AFTER `encrypt` (so /dev/mapper/root exists) and BEFORE
# `filesystems`. The append above puts it last -- after filesystems/fsck/
# btrfs-overlayfs -- so root is already mounted rw and fsck-ed by the time the
# hibernation image is restored, and the resumed kernel wakes with a stale view
# of a filesystem the boot kernel already wrote to. On btrfs that risks corruption.
_omarchy_resume_hooks=()
_omarchy_resume_added=0
for _omarchy_resume_hook in "${HOOKS[@]}"; do
  # Drop every existing `resume` entry; one is re-inserted at the right spot.
  [[ $_omarchy_resume_hook == "resume" ]] && continue
  if [[ $_omarchy_resume_hook == "filesystems" && $_omarchy_resume_added -eq 0 ]]; then
    _omarchy_resume_hooks+=(resume)
    _omarchy_resume_added=1
  fi
  _omarchy_resume_hooks+=("$_omarchy_resume_hook")
done
# No `filesystems` hook present -- append so resume is at least still there.
((_omarchy_resume_added)) || _omarchy_resume_hooks+=(resume)
HOOKS=("${_omarchy_resume_hooks[@]}")
unset _omarchy_resume_hooks _omarchy_resume_added _omarchy_resume_hook
