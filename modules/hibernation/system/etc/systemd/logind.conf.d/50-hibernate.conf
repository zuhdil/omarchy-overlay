# Closing the lid suspends to RAM first, then hibernates after
# HibernateDelaySec (see /etc/systemd/sleep.conf.d/50-hibernate-delay.conf).
# Short absences keep the instant RAM resume; longer ones fall through to
# hibernate so the battery is not drained.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
